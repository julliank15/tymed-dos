spring:
  application:
    name: tymed-dos-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tymed_dos}
    username: ${SPRING_DATASOURCE_USERNAME:tymed}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /openapi

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
